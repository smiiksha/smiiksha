<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 910" width="900" height="910" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE4EE"/><stop offset="1" stop-color="#FBCFE0"/></linearGradient>
<radialGradient id="pb" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFF1F7"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#9D174D"/></radialGradient>
<linearGradient id="pr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F43F5E"/><stop offset="0.35" stop-color="#FB923C"/><stop offset="0.65" stop-color="#FACC15"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
<clipPath id="fr"><rect x="0" y="150" width="300" height="150"/></clipPath>
<clipPath id="bk"><rect x="0" y="0" width="300" height="150"/></clipPath>
</defs>
<rect width="900" height="910" fill="url(#bg)"/>
<text x="50" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#831843">› Hey there! I'm Samiksha</text>
<line x1="50" y1="92" x2="850" y2="92" stroke="#F9A8D4" stroke-width="2"/>

<text x="50" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#831843">AI &amp; Deep Learning Undergrad | Class of 2028</text>
<text x="50" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#831843">I'm based in India and passionate about turning data</text>
<text x="50" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#831843">into intelligent decisions.</text>
<text x="50" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#BE185D">★ Top 3% nationally in Amazon ML Challenge 2026</text>
<text x="50" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#831843">Focus: Machine Learning, NLP, Deep Learning, DSA</text>
<text x="50" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#831843">Secretary @ IEEE Women in Engineering</text>

<g transform="translate(610,105) scale(0.8)">
<g transform="rotate(-22 150 150)">
<ellipse cx="150" cy="150" rx="125" ry="30" fill="none" stroke="url(#pr)" stroke-width="12" clip-path="url(#bk)"/>
<circle cx="150" cy="150" r="70" fill="url(#pb)"/>
<ellipse cx="150" cy="150" rx="125" ry="30" fill="none" stroke="url(#pr)" stroke-width="12" clip-path="url(#fr)"/>
</g></g>

<text x="50" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#831843">Code Snippet</text>
<rect x="50" y="392" width="800" height="360" rx="16" fill="#FFF5F9" stroke="#F9A8D4" stroke-width="2"/>
<circle cx="76" cy="410" r="0" fill="none"/>
<text x="75" y="422" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve"><tspan fill="#BE185D" font-weight="bold">class</tspan> Samiksha:</text>
<text x="75" y="446" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">    <tspan fill="#BE185D" font-weight="bold">def</tspan> __init__(<tspan fill="#BE185D" font-weight="bold">self</tspan>):</text>
<text x="75" y="470" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">self</tspan>.university = <tspan fill="#9D174D" font-style="italic">"Mody University of Science &amp; Technology"</tspan></text>
<text x="75" y="494" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">self</tspan>.degree     = <tspan fill="#9D174D" font-style="italic">"B.Tech CSE - AI &amp; Deep Learning"</tspan></text>
<text x="75" y="518" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">self</tspan>.location   = <tspan fill="#9D174D" font-style="italic">"India"</tspan></text>
<text x="75" y="542" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">self</tspan>.roles      = [<tspan fill="#9D174D" font-style="italic">"Secretary @ IEEE Women in Engineering"</tspan>]</text>
<text x="75" y="566" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">self</tspan>.learning   = [<tspan fill="#9D174D" font-style="italic">"Machine Learning"</tspan>, <tspan fill="#9D174D" font-style="italic">"NLP"</tspan>, <tspan fill="#9D174D" font-style="italic">"DSA"</tspan>, <tspan fill="#9D174D" font-style="italic">"Deep Learning"</tspan>]</text>
<text x="75" y="590" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">self</tspan>.passion    = <tspan fill="#9D174D" font-style="italic">"Turning data into intelligent decisions"</tspan></text>
<text x="75" y="614" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve"></text>
<text x="75" y="638" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">    <tspan fill="#BE185D" font-weight="bold">def</tspan> say_hi(<tspan fill="#BE185D" font-weight="bold">self</tspan>):</text>
<text x="75" y="662" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">        <tspan fill="#BE185D" font-weight="bold">return</tspan> <tspan fill="#9D174D" font-style="italic">"Thanks for dropping by! Let's build something amazing together"</tspan></text>
<text x="75" y="686" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve"></text>
<text x="75" y="710" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">me = Samiksha()</text>
<text x="75" y="734" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#831843" xml:space="preserve">print(me.say_hi())</text>

<text x="50" y="810" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#831843">Tech Stack</text>
<rect x="50" y="842" width="93.0" height="34" rx="17" fill="#F9A8D4"/><text x="96.5" y="864" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#831843">Python</text>
<rect x="155.0" y="842" width="102.5" height="34" rx="17" fill="#F9A8D4"/><text x="206.25" y="864" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#831843">PyTorch</text>
<rect x="269.5" y="842" width="131.0" height="34" rx="17" fill="#F9A8D4"/><text x="335.0" y="864" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#831843">TensorFlow</text>
<rect x="412.5" y="842" width="150.0" height="34" rx="17" fill="#F9A8D4"/><text x="487.5" y="864" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#831843">scikit-learn</text>
<rect x="574.5" y="842" width="64.5" height="34" rx="17" fill="#F9A8D4"/><text x="606.75" y="864" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#831843">Git</text>

</svg>
